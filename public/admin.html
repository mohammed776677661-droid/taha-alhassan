<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المنصة</title><link rel="stylesheet" href="/styles.css"></head><body><header><div class="nav wrap"><div class="logo"><span>ط</span><div><b>إدارة المنصة</b><small>الأستاذ طه الحسن</small></div></div><a href="/">عرض الموقع</a></div></header><main class="admin wrap"><section id="loginBox" class="login panel"><span class="pill">دخول الإدارة</span><h1>مرحباً بك</h1><form id="loginForm"><input id="email" type="email" value="admin@taha-platform.local" required><input id="password" type="password" placeholder="كلمة المرور" required><button class="btn">دخول</button></form><p id="loginMsg" class="error"></p></section><section id="dashboard" hidden><div class="section-head"><h1>لوحة التحكم</h1><button id="logout" class="btn ghost">خروج</button></div><div id="stats" class="stats"></div><div class="admin-grid"><div class="panel"><h2>إضافة دورة</h2><form id="courseForm"><input id="courseTitle" required placeholder="اسم الدورة"><input id="courseCategory" placeholder="المادة / التصنيف"><textarea id="courseDesc" placeholder="وصف الدورة"></textarea><button class="btn">إضافة</button></form></div><div class="panel"><h2>إضافة محاضرة</h2><form id="lectureForm" enctype="multipart/form-data"><select id="courseId" name="courseId" required></select><input name="title" required placeholder="عنوان المحاضرة"><textarea name="description" placeholder="الوصف"></textarea><label>فيديو <input name="video" type="file" accept="video/*"></label><label>ملف <input name="file" type="file"></label><button class="btn">رفع المحاضرة</button></form><p id="uploadMsg"></p></div></div><div class="panel"><h2>المحتوى الحالي</h2><div id="adminCourses"></div></div></section></main><script src="/admin.js"></script></body></html>
